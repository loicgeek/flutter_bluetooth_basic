// Define the group and version
group 'com.tablemi.flutter_bluetooth_basic'
version '1.0'

// Use new plugins DSL
plugins {
    id 'com.android.library'
}

// The Android configuration
android {
    namespace 'com.tablemi.flutter_bluetooth_basic'
    compileSdk 33  // Updated to a more recent SDK version
    
    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lint {
        disable 'InvalidPackage'
    }
}

// Dependencies section
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Specifically include the printer SDK jar
    implementation files('libs/gprintersdkv2.jar')
}

// Repository configurations
repositories {
    google()
    mavenCentral()  // jcenter() is deprecated, use mavenCentral() instead
}